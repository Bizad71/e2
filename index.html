<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a2b">
<link rel="manifest" href="manifest.json">
<title>چرخ واژگان</title>
<style>
:root{--bg1:#fff3d8;--bg2:#fce5f3;--panel:#ffffffeb;--panel2:#f0eaff;--text:#28304a;--muted:#777b96;--accent:#ff668c;--line:#eadcf4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#e5f7ff);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{height:100%;max-width:820px;margin:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 7px}
header h1{font-size:19px;margin:0;font-weight:900;color:#6e55c8}
#status{font-size:11px;color:#666b87;background:#ffffffb8;border:1px solid #fff;border-radius:20px;padding:6px 10px}
.main{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) 42%;gap:10px;flex:1;min-height:0}
.practice{direction:rtl;background:var(--panel);border:2px solid #fff;border-radius:24px;padding:14px 12px;display:flex;flex-direction:column;min-width:0;overflow:auto;box-shadow:0 12px 30px #9d79bb20}
.practice .hint{font-size:11px;color:var(--muted);margin-bottom:10px}
.word-head{font-size:clamp(20px,5vw,29px);font-weight:900;direction:ltr;text-align:center;word-break:break-word;margin:5px 0 13px;color:#7256d8;text-shadow:0 2px 0 #fff}
.action{border:0;border-radius:15px;background:linear-gradient(135deg,#8c75f4,#6d8cf5);color:white;padding:12px 10px;font:inherit;font-size:13px;font-weight:800;width:100%;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 12px #8c75f433}
.action:active{transform:scale(.98)}
#playWord{background:linear-gradient(135deg,#ff7b9d,#ffad75)}
.sentence-card{margin-top:12px;border:1px solid #f2d9e8;border-radius:19px;padding:12px;background:linear-gradient(145deg,#fff9fd,#fffdf4)}
.sentence{font-size:15px;line-height:1.9;direction:ltr;text-align:left;min-height:86px;display:flex;align-items:center;justify-content:center;color:#303b59;padding:4px}
.sentence-source{font-size:10px;color:#8b82a8;text-align:left;margin-top:4px;min-height:14px;direction:ltr}.translation{font-size:13px;color:#525878;line-height:1.9;border-top:1px dashed #e6cce0;margin-top:8px;padding-top:9px;text-align:right}
.hidden{display:none}
.sentence-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.sentence-actions .action{font-size:11px;padding:11px 5px}
.sentence-actions #toggleTranslation{background:linear-gradient(135deg,#43c9a5,#38a9c9)}
.wheel-wrap{direction:rtl;position:relative;border:2px solid #fff;border-radius:24px;background:linear-gradient(180deg,#ffffffd9,#f2eaffed);overflow:hidden;min-width:0;box-shadow:0 12px 30px #9d79bb20}
.wheel-title{text-align:center;color:#755bc8;font-size:12px;font-weight:900;height:32px;padding:10px 3px 2px}
.wheel{height:calc(100% - 32px);overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;padding:0 3px;direction:ltr}
.wheel::-webkit-scrollbar{display:none}
.wheel-item{height:58px;width:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;border:0;background:transparent;color:#777b99;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.48;transform:scale(.76);transition:transform .13s,opacity .13s,color .13s;direction:ltr;cursor:pointer;padding:0 4px;touch-action:pan-y}
.wheel-item.active{color:#fff;opacity:1;transform:scale(1.08);font-size:17px;font-weight:900;background:linear-gradient(90deg,#ff8ca8,#9b83ff);border-radius:14px;box-shadow:0 5px 14px #a184e844}
.wheel-item.near{opacity:.78;transform:scale(.91);color:#625c87}
.focus-line{position:absolute;left:5px;right:5px;top:calc(32px + (100% - 32px)/2);height:58px;transform:translateY(-50%);border:2px solid #a88cff88;pointer-events:none;border-radius:15px}
footer{font-size:10px;color:#72748e;text-align:center;padding:1px 4px}
@media(max-width:360px){.main{grid-template-columns:minmax(0,1fr) 40%;gap:7px}.practice{padding:11px 9px}.wheel-item{font-size:13px}.word-head{font-size:19px}}
@media(min-width:600px){.main{grid-template-columns:minmax(0,1fr) 260px}.practice{padding:22px}.wheel-item{height:64px}.focus-line{height:64px}}
</style>
</head>
<body>
<div class="app">
<header><h1>چرخ واژگان</h1><span id="status">در حال آماده‌سازی…</span></header>
<div class="main">
<section class="practice">
<div class="hint">برای شنیدن تلفظ، کلمه را از چرخ سمت راست انتخاب کن.</div>
<div class="word-head" id="selectedWord">Hello</div>
<button class="action" id="playWord">▶ پخش تلفظ کلمه</button>
<div class="sentence-card">
<div class="hint">جمله‌سازی — برای جمله جدید دوباره بزن</div>
<div class="sentence" id="sentence">Tap the sentence button to make an example.</div>
<div class="sentence-source" id="sentenceSource"></div>
<div class="translation hidden" id="translation"></div>
<div class="sentence-actions">
<button class="action" id="newSentence">جمله جدید</button>
<button class="action" id="toggleTranslation">نمایش ترجمه</button>
</div>
</div>
</section>
<aside class="wheel-wrap">
<div class="wheel-title">فهرست واژه‌ها</div>
<div class="wheel" id="wheel" aria-label="چرخ واژگان"></div>
<div class="focus-line"></div>
</aside>
</div>
<footer>جمله‌ها از Tatoeba دریافت می‌شوند · نتایج قبلی در همین مرورگر ذخیره می‌شوند و آفلاین هم قابل مشاهده‌اند.</footer>
</div>
<audio id="audio" preload="none"></audio>
<script>
const wheel=document.getElementById('wheel'), wordTitle=document.getElementById('selectedWord');
const sentenceBox=document.getElementById('sentence'), translationBox=document.getElementById('translation');
const sentenceSource=document.getElementById('sentenceSource');
const statusEl=document.getElementById('status'), audio=document.getElementById('audio');
const toggleTranslation=document.getElementById('toggleTranslation');
let words=[], selected=0, scrollFrame=0, suppressScroll=false;
let sentenceLists={}, sentenceIndexes={}, loadingSentence=false;
const DB_NAME='word-wheel-memory', DB_VERSION=1, STORE='records';

function openDB(){return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
});}
async function dbGet(key){try{const db=await openDB();return await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(key);
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
});}catch(e){return null;}}
async function dbPut(key,value){try{const db=await openDB();return await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);
  tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
});}catch(e){return false;}}
function setStatus(message){statusEl.textContent=message;}

async function loadWords(){
  try{
    let data;
    try{const res=await fetch('./words.json',{cache:'no-store'});if(!res.ok)throw new Error('words.json not found');
      data=await res.json();await dbPut('words',data);
    }catch(networkError){data=await dbGet('words');if(!data)throw networkError;}
    words=Array.isArray(data)?data:(data.words||[]);words=words.filter(x=>x&&x.word);
    if(!words.length)throw new Error('No words in JSON');
    renderWheel();selectWord(0,false);
    setStatus(navigator.onLine?`${words.length} واژه · آنلاین`:`${words.length} واژه · آفلاین`);
  }catch(e){setStatus('خطا در بارگذاری واژه‌ها');sentenceBox.textContent='فایل words.json یا نسخه ذخیره‌شده آن پیدا نشد.';console.error(e);}
}
function renderWheel(){
  wheel.innerHTML='';const copies=5;
  for(let copy=0;copy<copies;copy++)words.forEach((item,i)=>{
    const b=document.createElement('button');b.className='wheel-item';b.type='button';b.textContent=item.word;b.dataset.index=i;
    b.addEventListener('click',()=>selectWord(i,true));wheel.appendChild(b);
  });
  const target=words.length*2;
  requestAnimationFrame(()=>{const el=wheel.children[target];
    if(el)wheel.scrollTop=el.offsetTop-wheel.offsetTop-wheel.clientHeight/2+el.clientHeight/2;updateWheelScale();});
}
function nearestItem(){
  const center=wheel.scrollTop+wheel.clientHeight/2;let best=null,dist=Infinity;
  [...wheel.children].forEach(el=>{const d=Math.abs((el.offsetTop+el.offsetHeight/2)-center);if(d<dist){dist=d;best=el;}});return best;
}
function updateWheelScale(){
  const center=wheel.scrollTop+wheel.clientHeight/2;
  [...wheel.children].forEach(el=>{const d=Math.abs((el.offsetTop+el.offsetHeight/2)-center);
    el.classList.toggle('active',d<30);el.classList.toggle('near',d>=30&&d<100);});
}
function selectWord(index,play=true){
  selected=(index+words.length)%words.length;wordTitle.textContent=words[selected].word;
  translationBox.classList.add('hidden');translationBox.textContent='';toggleTranslation.textContent='نمایش ترجمه';
  showNewSentence();
  const candidates=[...wheel.children].filter(el=>Number(el.dataset.index)===selected);
  const center=wheel.scrollTop+wheel.clientHeight/2;
  const target=candidates.sort((a,b)=>Math.abs(a.offsetTop+a.offsetHeight/2-center)-Math.abs(b.offsetTop+b.offsetHeight/2-center))[0];
  if(target){suppressScroll=true;wheel.scrollTo({top:target.offsetTop-wheel.offsetTop-wheel.clientHeight/2+target.clientHeight/2,behavior:'smooth'});
    setTimeout(()=>{suppressScroll=false;updateWheelScale();},300);}
  if(play)playPronunciation();
}
function current(){return words[selected]||{};}
function normalizeApiResults(payload){
  const rows=Array.isArray(payload?.data)?payload.data:[];
  return rows.map(row=>{
    const translations=Array.isArray(row.translations)?row.translations:[];
    const fa=translations.find(t=>(t.lang==='pes'||t.lang==='fas'||t.lang_name==='Persian')&&t.text);
    return {sentence:String(row.text||'').trim(),translation:String(fa?.text||'').trim(),source:'Tatoeba',id:row.id,owner:row.owner||'نامشخص',license:row.license||''};
  }).filter(x=>x.sentence);
}
async function fetchTatoeba(word){
  const params=new URLSearchParams({lang:'eng',q:word,'trans:lang':'pes',showtrans:'matching',
    is_unapproved:'no',is_orphan:'no',sort:'relevance',limit:'20'});
  const response=await fetch('https://api.tatoeba.org/v1/sentences?'+params.toString(),{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('Tatoeba API '+response.status);
  return normalizeApiResults(await response.json());
}
async function getSentences(word){
  const key='sentences:'+word.toLowerCase();let cached=sentenceLists[word.toLowerCase()];
  if(!cached){cached=await dbGet(key);if(Array.isArray(cached))sentenceLists[word.toLowerCase()]=cached;}
  if(Array.isArray(cached)&&cached.length)return cached;
  if(!navigator.onLine)return [];
  try{const fresh=await fetchTatoeba(word);if(fresh.length){
    sentenceLists[word.toLowerCase()]=fresh;await dbPut(key,fresh);return fresh;
  }}catch(error){console.warn(error);}
  return [];
}
function showSentence(entry){
  sentenceBox.textContent=entry.sentence||'';
  translationBox.textContent=entry.translation||'ترجمه فارسی این جمله در منبع موجود نبود.';
  translationBox.classList.add('hidden');toggleTranslation.textContent='نمایش ترجمه';
  if(entry.source==='Tatoeba'){sentenceSource.textContent=`منبع: Tatoeba · نویسنده: ${entry.owner||'نامشخص'} · مجوز: ${entry.license||'CC BY 2.0 FR'}`;setStatus(navigator.onLine?'جمله از Tatoeba · ذخیره شد':'جمله ذخیره‌شده · آفلاین');}
  else sentenceSource.textContent='';
}
async function showNewSentence(){
  if(loadingSentence)return;loadingSentence=true;const word=current().word||'',key=word.toLowerCase();
  sentenceBox.textContent=navigator.onLine?'در حال پیدا کردن جمله…':'در حال جست‌وجوی حافظه آفلاین…';
  translationBox.classList.add('hidden');toggleTranslation.textContent='نمایش ترجمه';
  try{
    const list=await getSentences(word);
    if(list.length){let idx=sentenceIndexes[key]||0;if(idx>=list.length)idx=0;showSentence(list[idx]);sentenceIndexes[key]=idx+1;}
    else{
      const examples=Array.isArray(current().examples)?current().examples:[];
      if(examples.length){let idx=(sentenceIndexes[key]||0)%examples.length;
        showSentence({sentence:examples[idx].sentence,translation:examples[idx].translation,source:'JSON'});
        sentenceIndexes[key]=idx+1;if(!navigator.onLine)setStatus('جمله نمونه ذخیره‌شده · آفلاین');
      }else{sentenceBox.textContent=navigator.onLine?'برای این کلمه هنوز جمله‌ای در API پیدا نشد.':'برای این کلمه هنوز جمله‌ای در حافظه آفلاین ذخیره نشده است.';
        translationBox.textContent='وقتی اینترنت وصل باشد دوباره امتحان کن.';}
    }
  }finally{loadingSentence=false;}
}
function playPronunciation(){
  const item=current();if(item.audio){audio.pause();audio.src=item.audio;audio.currentTime=0;audio.play().catch(()=>speakFallback(item.word));}
  else speakFallback(item.word);
}
function speakFallback(word){
  if(!('speechSynthesis'in window)){setStatus('فایل صوتی این واژه موجود نیست');return;}
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);
  setStatus('تلفظ با صدای دستگاه · آفلاین تضمین‌شده نیست');
}
wheel.addEventListener('scroll',()=>{
  if(scrollFrame)cancelAnimationFrame(scrollFrame);
  scrollFrame=requestAnimationFrame(()=>{updateWheelScale();const el=nearestItem();
    if(el&&!suppressScroll){const i=Number(el.dataset.index);if(i!==selected){
      selected=i;wordTitle.textContent=current().word;translationBox.classList.add('hidden');showNewSentence();}}});
},{passive:true});
document.getElementById('playWord').addEventListener('click',playPronunciation);
document.getElementById('newSentence').addEventListener('click',showNewSentence);
toggleTranslation.addEventListener('click',()=>{translationBox.classList.toggle('hidden');
  toggleTranslation.textContent=translationBox.classList.contains('hidden')?'نمایش ترجمه':'بستن ترجمه';});
window.addEventListener('online',()=>setStatus(`${words.length} واژه · آنلاین`));
window.addEventListener('offline',()=>setStatus('حالت آفلاین · داده‌های ذخیره‌شده'));
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadWords();
</script>
</body>
</html>
